<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>X4SPORT · Gestión Operativa y Financiera</title>
    <meta name="description" content="Plataforma de gestión operativa, inventario, ventas, compras y matriz financiera de 4 capas para X4SPORT." />
    <meta property="og:title" content="X4SPORT · Gestión Operativa y Financiera" />
    <meta property="og:description" content="Plataforma de gestión operativa, inventario, ventas, compras y matriz financiera de 4 capas para X4SPORT." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var search = window.location.search || '';
          var hash = (window.location.hash || '').toLowerCase();
          var path = (window.location.pathname || '').toLowerCase();
          var params = new URLSearchParams(search);
          var catParam = params.get('catalogo') || params.get('catalog');
          var viewParam = params.get('view');
          var isCatalog =
            catParam === '1' ||
            catParam === 'true' ||
            viewParam === 'catalog' ||
            hash === '#catalogo' ||
            hash === '#/catalogo' ||
            path === '/catalogo' ||
            path.endsWith('/catalogo');

          var isDark;
          if (isCatalog) {
            isDark =
              typeof window.matchMedia === 'function'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                : true;
          } else {
            var key = 'x4sport_theme_preference';
            var raw = window.localStorage.getItem(key);
            var pref = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'dark';
            isDark =
              pref === 'dark' ||
              (pref === 'system' &&
                typeof window.matchMedia === 'function' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches);
          }

          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#060B16] dark:text-slate-100 antialiased selection:bg-blue-600/30 selection:text-white">
    <div id="root"></div>
    <!-- SheetJS (xlsx) via CDN para importación y mapeo automático de Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
